spring.application.name=studymate-backend
server.port=${PORT:8080}

llm.base-url=${LLM_BASE_URL:http://localhost:11434/v1}
llm.api-key=${LLM_API_KEY:ollama}
llm.model=${LLM_MODEL:qwen2.5:1.5b}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/studymate;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always